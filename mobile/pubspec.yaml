name: uniway_mobile
description: UniWay Phase 0 Campus Navigation Client for Manipal University Jaipur
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  maplibre_gl: ^0.27.0
  http: ^1.2.0
  geolocator: ^12.0.0
  shared_preferences: ^2.2.2
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/geo/supplementary_layer.geojson
    - assets/icons/poi/
    - assets/map/
